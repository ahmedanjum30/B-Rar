name: Release

# Pushing a v* tag builds the Microsoft Store package (a workflow artifact, uploaded to Partner
# Center by hand; Microsoft signs it) and publishes the installer (B-Rar-Setup), the portable
# zip and the MSIX signed with B-Rar's own certificate as a GitHub release, with the website.
# Copies outside the Store update from these releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The same format, lint and test checks as CI. They run alongside the build; nothing is
  # published unless both succeed.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: windows-latest
    env:
      # B-Rar's signing certificate (installer\new-cert.ps1), exported as a .pfx in base64,
      # and its password. Without them the signed package is left out.
      MSIX_CERT_PFX: ${{ secrets.MSIX_CERT_PFX }}
      MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Unsigned, with the identity Partner Center assigned (installer\store-identity.json).
      - name: Build the Store package
        shell: pwsh
        run: ./installer/build.ps1 -Store

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # The release binaries are built already (by the Store package).
      - name: Build the installer
        shell: pwsh
        run: ./installer/build-setup.ps1

      # The sideloaded package: the certificate goes into the runner's store, where build.ps1
      # looks for it (by subject and friendly name).
      - name: Build the signed package
        if: env.MSIX_CERT_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'brar.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_PFX))
          $password = ConvertTo-SecureString $env:MSIX_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $cert.FriendlyName = 'B-Rar MSIX signing'
          ./installer/build.ps1

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $name = "B-Rar-$version-portable-x64"
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          Copy-Item target\release\B-Rar.exe, target\release\B-Rar-GUI.exe, README.md, LICENSE, installer\unrar-license.txt "dist\$name"
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name.zip"
          Remove-Item -Recurse "dist\$name"
          Get-ChildItem dist -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*-x64.msix' -or $_.Name -like 'B-Rar-Setup-*.exe' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/B-Rar-Setup-*.exe
            dist/B-Rar-*-portable-x64.zip
            dist/B-Rar-*-x64.msix
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # For Partner Center (Packages > upload); not a download for users.
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: dist/B-Rar-*-store.msix
          if-no-files-found: error

  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Shown above the generated list of changes.
          body: |
            ## Install

            Download **B-Rar-Setup-${{ github.ref_name }}.exe** below and run it. It installs for your user only, without admin rights, and adds B-Rar to the right-click menu of archives (on Windows 11 under **Show more options**). Installed copies update themselves: B-Rar says when a new version is out.

            > **Windows says "Windows protected your PC"?** Click **More info**, then **Run anyway**. B-Rar isn't code-signed yet, so Windows doesn't know the publisher. The installer is the one built by this repository's release workflow; you can check it against `SHA256SUMS.txt`.

            **The `-portable-x64.zip`** has `B-Rar.exe` (command line) and `B-Rar-GUI.exe` with nothing to install and no right-click menu.

            **Microsoft Store:** coming soon, with the Windows 11 short right-click menu and updates through the Store (and `winget install B-Rar`).
          generate_release_notes: true

  # The website (docs/) on GitHub Pages, served from the gh-pages branch, with this version's
  # installer and portable zip at fixed links without redirects:
  # https://ahmedanjum30.github.io/B-Rar/download/<version>/, and the newest installer at
# https://ahmedanjum30.github.io/B-Rar/download/B-Rar-Setup.exe (the website's download button).
  pages:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Update the site
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd site
          # The site from main's docs/; earlier versions' downloads stay.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name download -exec rm -rf {} +
          cp -r ../main/docs/. .
          mkdir -p "download/$version"
          cp "../release/B-Rar-$version-portable-x64.zip" "../release/B-Rar-Setup-$version.exe" "download/$version/"
          cp "../release/B-Rar-Setup-$version.exe" download/B-Rar-Setup.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Site and downloads $version"
          git push

[workspace]
resolver = "3"
members = ["crates/brar-core", "crates/brar-cli", "crates/brar-gui", "crates/brar-shell"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ahmedanjum30/B-Rar"
authors = ["Ahmad Anjum"]

[patch.crates-io]
# Exposes RAR's full-precision modification time and a progress hook (vendor/unrar/src).
unrar = { path = "vendor/unrar" }
# Disables unRAR's quick-open cache in DLL mode (vendor/unrar_sys/vendor/unrar/dll.cpp).
unrar_sys = { path = "vendor/unrar_sys" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true

# For local test builds (`installer\build.ps1 -Quick`), as in BDownloader: builds in parallel
# and reuses unchanged code instead of optimising the whole program as one unit on one core.
# Fine for trying things out; too slow to benchmark (no cross-crate inlining). Releases and
# benchmarks use the full release profile above.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Fast-to-build profile for benchmarking iterations.
[profile.bench-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

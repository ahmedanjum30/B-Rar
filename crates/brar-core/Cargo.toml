[package]
name = "brar-core"
description = "Archive reading engine for B-Rar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.3"
blake2s_simd = "1.0.5"
bzip2 = "0.6.1"
crc32fast = "1.5.3"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
hmac = "0.13.0"
jiff = "0.2"
liblzma = { version = "0.4.9", default-features = false, features = ["parallel", "static"] }
memmap2 = "0.9.11"
rayon = "1.12.0"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["aes256", "bzip2", "ppmd", "deflate", "zstd", "lz4", "brotli"] }
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
unrar = "0.5.8"
zip = { version = "9.0.5", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "ppmd", "xz", "zstd"] }
zstd = "0.14.3"

[dev-dependencies]
# Only to benchmark B-Rar's Deflate decoder against.
libdeflater = "1.26.1"
cbc = "0.2.1"

[package]
name = "brar-gui"
description = "B-Rar's window (progress, prompts), opened from the Explorer menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "B-Rar-GUI"
path = "src/main.rs"

[dependencies]
brar-core = { path = "../brar-core" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
jiff = "0.2.38"
# The window handle, so the folder picker opens over the browser window.
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0.12"

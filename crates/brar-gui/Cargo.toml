[package]
name = "brar-gui"
description = "B-Rar's window (progress, prompts), opened from the Explorer menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "B-Rar-GUI"
path = "src/main.rs"

[dependencies]
brar-core = { path = "../brar-core" }
jiff = "0.2.38"
# Checking downloaded updates against the release's SHA256SUMS.txt.
sha2 = "0.11.1"
# The windows themselves are plain Win32: standard controls, no UI framework (size).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Networking_WinHttp", "Win32_Storage_Packaging_Appx"] }

[build-dependencies]
embed-resource = "3.0.12"
